[tool.black]
target-version = ["py312"]
line-length = 100
skip-string-normalization = false
extend-exclude = "^\\.venv/|__pycache__/|media/"

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["setup", "tracking"]
extend-exclude = [".venv", "__pycache__", "media"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "N", "UP", "B", "A", "C4", "PIE", "SIM", "T20"]
ignore = ["E501", "W191"]

[tool.ruff.lint.isort]
known-first-party = ["setup", "tracking"]
