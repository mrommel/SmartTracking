{% extends "tracking/base.html" %}

{% block content %}
	<nav aria-label="breadcrumb">
		<ol class="breadcrumb">
			<li class="breadcrumb-item"><a href="{% url 'project_list' %}">Projects</a></li>
			<li class="breadcrumb-item"><a href="{% url 'project_detail' project.pk %}?tab=releases">{{ project.key }}</a></li>
			<li class="breadcrumb-item active">{{ title }}</li>
		</ol>
	</nav>

	<div class="card" style="max-width: 600px;">
		<div class="card-body">
			<h5 class="card-title">{{ title }}</h5>
			<form method="post">
				{% csrf_token %}
				{% for field in form %}
					<div class="mb-3">
						<label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
						{{ field }}
						{% if field.errors %}
							<div class="text-danger small">{{ field.errors }}</div>
						{% endif %}
					</div>
				{% endfor %}
				<div class="d-flex gap-2">
					<button type="submit" class="btn btn-primary">Save</button>
					<a href="{% url 'project_detail' project.pk %}?tab=releases" class="btn btn-secondary">Cancel</a>
				</div>
			</form>
		</div>
	</div>
{% endblock %}
