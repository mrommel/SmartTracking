{% extends "tracking/base.html" %}

{% block content %}
	<nav aria-label="breadcrumb">
		<ol class="breadcrumb">
			<li class="breadcrumb-item"><a href="{% url 'project_list' %}">Projects</a></li>
			<li class="breadcrumb-item"><a href="{% url 'project_detail' project.pk %}?tab=releases">{{ project.key }}</a></li>
			<li class="breadcrumb-item active">{{ title }}</li>
		</ol>
	</nav>

	<div class="card" style="max-width: 500px;">
		<div class="card-body">
			<h5 class="card-title">Delete version</h5>
			<p class="text-muted">Are you sure you want to delete version "{{ version.name }}"?</p>
			<form method="post">
				{% csrf_token %}
				{{ form.as_p }}
				<div class="d-flex gap-2">
					<button type="submit" class="btn btn-danger">Delete</button>
					<a href="{% url 'project_detail' project.pk %}?tab=releases" class="btn btn-secondary">Cancel</a>
				</div>
			</form>
		</div>
	</div>
{% endblock %}
