{% extends "tracking/base.html" %}
{% load crispy_forms_tags %}

{% block content %}
	<div class="row justify-content-center">
		<div class="col-lg-7">
			<h1 class="h3 mb-3">Edit ticket</h1>
			<div class="card">
				<div class="card-body">
					<form method="post">
						{% csrf_token %}
						{{ form|crispy }}
						<div class="d-flex gap-2">
							<button type="submit" class="btn btn-primary">Save changes</button>
							<a href="{% url 'ticket_detail' ticket.pk %}" class="btn btn-outline-secondary">Cancel</a>
						</div>
					</form>
				</div>
			</div>
		</div>
	</div>
{% endblock %}
