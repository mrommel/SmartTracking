{% extends "tracking/base.html" %}

{% block content %}
	<div class="d-flex justify-content-between align-items-center mb-3">
		<h1 class="h3 mb-0">Projects</h1>
	</div>

	<div class="card">
		<table class="table table-hover mb-0 align-middle">
			<thead>
				<tr>
					<th style="width: 8rem">Key</th>
					<th>Name</th>
					<th class="text-end" style="width: 8rem">Tickets</th>
				</tr>
			</thead>
			<tbody>
				{% for project in projects %}
					<tr>
						<td><span class="badge text-bg-secondary">{{ project.key }}</span></td>
						<td>
							<a href="{% url 'ticket_list' %}?project={{ project.key }}">{{ project.name }}</a>
						</td>
						<td class="text-end">{{ project.ticket_count }}</td>
					</tr>
				{% empty %}
					<tr><td colspan="3" class="text-muted">No projects yet. Create one in the admin.</td></tr>
				{% endfor %}
			</tbody>
		</table>
	</div>
{% endblock %}
