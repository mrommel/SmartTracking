{% extends "tracking/base.html" %}

{% block content %}
	<nav aria-label="breadcrumb">
		<ol class="breadcrumb">
			<li class="breadcrumb-item"><a href="{% url 'ticket_list' %}">Tickets</a></li>
			<li class="breadcrumb-item"><a href="{% url 'ticket_list' %}?project={{ ticket.project.key }}">{{ ticket.project.key }}</a></li>
			<li class="breadcrumb-item"><a href="{% url 'ticket_detail' ticket.pk %}">{{ ticket.title }}</a></li>
			<li class="breadcrumb-item active">Change state</li>
		</ol>
	</nav>

	<div class="card" style="max-width: 500px">
		<div class="card-body">
			<h1 class="h4 mb-3">Change state</h1>
			<form method="post">
				{% csrf_token %}
				<div class="mb-3">
					{{ form.state.label }}
					{{ form.state }}
					{% if form.state.errors %}
						<div class="text-danger small">{{ form.state.errors }}</div>
					{% endif %}
				</div>
				<div class="d-flex gap-2">
					<button type="submit" class="btn btn-primary">Update</button>
					<a href="{% url 'ticket_detail' ticket.pk %}" class="btn btn-secondary">Cancel</a>
				</div>
			</form>
		</div>
	</div>
{% endblock %}
