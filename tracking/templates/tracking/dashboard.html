{% extends "tracking/base.html" %}

{% block content %}
	<div class="d-flex justify-content-between align-items-center mb-3">
		<h1 class="h3 mb-0">Projects</h1>
		<a class="btn btn-primary" href="{% url 'project_create' %}">+ New project</a>
	</div>

	<div class="card">
		<table class="table table-hover mb-0 align-middle">
			<thead>
				<tr>
					<th style="width: 8rem">Key</th>
					<th>Name</th>
					<th class="text-end" style="width: 10%">Tickets</th>
				</tr>
			</thead>
			<tbody>
				{% for project in projects %}
					<tr>
						<td>{% #badge %}{{ project.key }}{% /badge %}</td>
						<td><a href="{% url 'project_detail' project.pk %}">{{ project.name }}</a></td>
						<td class="text-end">{{ project.ticket_count }}</td>
					</tr>
				{% empty %}
					<tr><td colspan="3" class="text-muted">No projects yet. <a href="{% url 'project_create' %}">Create one.</a></td></tr>
				{% endfor %}
			</tbody>
		</table>
	</div>
{% endblock %}
